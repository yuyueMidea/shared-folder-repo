<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="在线代码对比工具：左右可编辑，实时高亮差异。内容只保存在你的浏览器本地。" />
    <title>代码对比 - 在线 Diff 工具</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // 首屏前设置主题，避免闪烁
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('codediff:v1') || 'null')
          var t = s && s.theme
          if (t !== 'light' && t !== 'dark') {
            t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          }
          document.documentElement.dataset.theme = t
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
